<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwenalia 2026 – Twoja Uczelnia</title>

    <link rel="stylesheet" href="main.css">

    <script src="timer.js" defer></script>
    <script src="form.js" defer></script>
    <script src="blok3.js" defer></script>
</head>

<body>

    <!-- 🔥 BLOK 1: Nawigacja -->
    <nav class="crazy-nav">
        <a href="#lineup" class="nav-link">Line-up</a>
        <a href="#schedule" class="nav-link">Harmonogram</a>
        <a href="#location" class="nav-link">Lokalizacja</a>
        <a href="#faq" class="nav-link">FAQ</a>
        <a href="#contact" class="nav-link">Kontakt</a>
    </nav>

    <!-- 🔥 BLOK 2: Hero -->
    <section class="hero">
        <h1>Juwenalia 2026</h1>
        <p>Największe święto studentów już 24–26 maja!</p>
        <a href="#lineup" class="btn">Zobacz line-up</a>
    </section>

    <section class="countdown-section">
    <div class="countdown-wrapper">
        <h2 class="countdown-title">Juwenalia startują za</h2>
        <div class="countdown" id="countdown">
        <div class="time-box">
            <span class="time" id="days">00</span>
            <span class="label">dni</span>
        </div>
        <div class="time-box">
            <span class="time" id="hours">00</span>
            <span class="label">godzin</span>
        </div>
        <div class="time-box">
            <span class="time" id="minutes">00</span>
            <span class="label">minut</span>
        </div>
        <div class="time-box">
            <span class="time" id="seconds">00</span>
            <span class="label">sekund</span>
        </div>
        </div>
        <p class="countdown-subtitle">23 maja 2026 • Kampus Akademii Tarnowskiej</p>
    </div>
    </section>

    <!-- 🔥 BLOK 3: Line-up -->
    <section id="lineup">
        <h2>Line-up - 23 Maja</h2>
        <div id="artists-container" class="artists-grid">
        </div>
    </section>

    <!-- 🔥 BLOK 4: Harmonogram -->
    <section id="schedule">
        <h2>Harmonogram</h2>
        <div id="schedule-content">
            <!-- Tutaj wstawicie timeline / tabelę -->
        </div>
    </section>

    <!-- 🔥 BLOK 5: Lokalizacja -->
    <section id="location">
        <h2>Lokalizacja</h2>
        <div id="map" style="height: 300px; background: #333;">
            <!-- Mapa (embed lub JS) -->
        </div>
    </section>

    <!-- 🔥 BLOK 6: FAQ -->
    <section class="dopamine-form-section">
  <div class="dopamine-form-wrapper">
    <h2 class="dopamine-title">Napisz do nas</h2>

    <form class="dopamine-form">
      <div class="input-group">
        <input type="text" required>
        <label>Imię</label>
        <span class="focus-border"></span>
      </div>

      <div class="input-group">
        <input type="email" required>
        <label>Email</label>
        <span class="focus-border"></span>
      </div>

      <div class="input-group textarea">
        <textarea required></textarea>
        <label>Treść wiadomości</label>
        <span class="focus-border"></span>
      </div>

      <button type="submit" class="dopamine-btn">
        Wyślij wiadomość
      </button>
    </form>
  </div>
</section>

    <!-- 🔥 BLOK 7: Kontakt -->
    <section id="contact">
        <h2>Kontakt</h2>
        <form id="contact-form">
            <input type="text" placeholder="Imię" required><br><br>
            <input type="email" placeholder="Email" required><br><br>
            <textarea placeholder="Wiadomość" required></textarea><br><br>
            <button type="submit" class="btn">Wyślij</button>
        </form>
    </section>

</body>
</html>
